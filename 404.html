<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>NG Drop Taxi - Redirecting...</title>
    <script>
        // Single Page App Router Redirect Hack for GitHub Pages
        // This takes the current requested path and passes it to index.html via query parameters
        var pathSegmentsToKeep = 0; // Set to 1 if using a project repo subpath (e.g., username.github.io/repo-name)
        var l = window.location;
        l.replace(
            l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
            l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?p=/' +
            l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
            (l.search ? '&q=' + l.search.slice(1).replace(/&/g, '~and~') : '') +
            l.hash
        );
    </script>
</head>
<body>
</body>
</html>
